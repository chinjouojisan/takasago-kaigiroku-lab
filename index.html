その例えばほんとにそういった子どもたちの学力向上のためのプログラムなり…", "s": "R040930A-10"}, {"k": "一般質問", "t": "まず、1番の介護ボランティアポイントとたかさご未来資産を貯めようプロジェクトのことなんですけども、まず介護ボランティアポイントのほうが市長の答弁で、4年前に検討されましたけど、ちょっと事業化が難しいということで断念されたような経過がありますが、その内容について、もう少し詳しくお聞かせいただけますでし…", "s": "R041212A-13"}, {"k": "一般質問", "t": "まず、1点目の地域脱酸素の取組で、先ほど部長も述べられましたけど、やっぱり企業とのタイアップみたいなのをこれからしていってくださいみたいなことで環境省の職員が言われたので、やっぱりそういった企業と協力してやっていくいうのが大きな流れになってきてるのかなと思いまして、これまであんまり、何か私ら古いかも…", "s": "R050626A-12"}]}}}, {"id": "M013", "name": "鷹尾治久", "yomi": "たかお はるひさ", "region": "阿弥陀町", "party": "無所属", "rank": 5, "votes": 1859, "faction": "明風会", "interview": "https://takasagochoice.hatenablog.com/entry/takaoharuhisa", "pledges": [{"id": "P1", "t": "健康・福祉のまちづくり(公園の充実推進、緑化事業、民間健康増進手法の提案、自治会活動の活性化支援など)", "scope": "中", "direct": 0, "peri": 2, "status": "弱い"}, {"id": "P2", "t": "産業発展と働く人を支援するまちづくり(インフラ整備、環境関連事業、観光事業、勤労者福祉の充実、就労支援)", "scope": "中", "direct": 3, "peri": 11, "status": "確認できた"}, {"id": "P3", "t": "安全に住み続けられるまちづくり(通学路の危険箇所の改善、自然災害対策、市内防犯カメラ設置促進など)", "scope": "中", "direct": 1, "peri": 9, "status": "確認できた"}, {"id": "P4", "t": "次世代育成を積極的に支援するまちづくり(子供の貧困対策、障害のある子どもと家庭への支援、教育環境の整備(オンライン活用、国際交流))", "scope": "中", "direct": 0, "peri": 8, "status": "弱い"}], "s": {"name": "鷹尾治久", "total": 2.58, "pledge": 0.449, "podium": 0.67, "committee": 0.48, "role": 0.2, "gq": 0.559, "cq": 0.218, "rdg": 0.895, "rdc": 0.964, "ng": 22, "nc": 33, "rnum": 0.52, "rprop": 0.95, "rcmp": 0.43, "crn": 0.89, "crc": 0.81, "ev": {"C": [{"k": "一般質問", "t": "中にも看板がついていまして、お願い、ゴミを捨てないでください、美しいまちづくりにご協力お願いします、高砂市と。これを私は約3週間ほど前に、この近隣の方からご相談を受けて、当局にもお話をさせていただきました。答えは年2回ですからということでしたけど、それでいいんですか。都市創造部長のご答弁にも臨機応変…", "s": "R050920A-04"}, {"k": "一般質問", "t": "それなりのお答えをされているんですけど、いろいろな部長が今の写真を見られまして、もう一回つけてもらえたらと思いますけど、これは高砂市の看板を立てているエリアです。それを見られて、みんなで話し合われて、高砂市は市民満足度を高めようと言っている、将来においては借地ですからどうされるかというのはあるにして…", "s": "R050920A-04"}, {"k": "一般質問", "t": "私、ご理解いただいたと思うんですけど、相談に乗られた方が、その相談と、地域交流センターでの窓口になっていただいた方が、どれほどのレベルでお仕事をしていただいたことが、どれほど満足感を得たかと。ただ、限界もあるかと思うんですけど、その辺のところを丁寧に声を拾う   if(h.startsWith('#/m/')){const id=h.slice(4);if(LOADED[id]&&QA[id]!==undefined)return member(id);nav('');$('#main').innerHTML='<div class="card" id="ld">議員のデータを読み込んでいます…</div>';loadMember(id).then(()=>{if((location.hash||'')==='#/m/'+id)member(id)}).catch(()=>{if((location.hash||'')==='#/m/'+id)$('#main').innerHTML='<div class="card">データを読み込めませんでした。通信状況を確認して、<a class="out" href="#/m/'+id+'" onclick="setTimeout(route,0)">もう一度開く</a>。</div>'});return}
  if(h==='#/guide')return guidePage();if(h==='#/rank')return rankPage();if(h==='#/about')return about();if(h==='#/method')return methodPage();return home()}
function card(d){return `<a class="mem" href="#/m/${d.id}" data-n="${esc(d.name+d.yomi)}">${ph(d)}<div><b>${esc(d.name)}</b><small>${esc(d.yomi)}</small><small>${esc(regionOf(d)||'')} ・ ${esc(d.faction||d.party||'')}</small></div></a>`}
function home(keep){nav('#/');const cnt={};DATA.forEach(d=>{const r=regionOf(d);if(r)cnt[r]=(cnt[r]||0)+1});
  const list=[...DATA].sort((a,b)=>a.yomi.localeCompare(b.yomi,'ja')).filter(d=>!region||regionOf(d)===region);
  $('#main').innerHTML=`<section class="hero"><img alt="高砂市議会議員マップ 市民目線の通信簿" src="${IMG.ogp}"></section>
  <section class="card cta"><div style="flex:1;min-width:14em"><b>はじめての方へ</b><br><span class="muted">市議会は何をするところか、点数の読み方を3分で読めます。</span></div><a class="btn" href="#/guide">案内を読む</a></section>
  <section class="sec" id="listsec"><input class="q" id="q" placeholder="名前で探す" oninput="filt()" aria-label="名前で探す">
   <div class="muted">${region?`${region}地区 ${list.length}人 <a class="chip" href="#/" onclick="region=null;home();return false">解除</a>`:`前任期の議員${DATA.length}人。五十音順です。`} <a class="chip" href="#/rank">ランキングを見る</a></div>
   <div class="grid" id="list">${list.map(card).join('')}</div></section>
  <section class="sec" id="mapsec"><h2>地図から議員を探す<small>連合自治会の区分</small></h2><div class="mapwrap">
   <div class="mapbox"><img alt="高砂市の地区の地図" src="${IMG.map}">${Object.entries(POS).map(([r,[x,y]])=>`<button class="${region===r?'on':''}" style="left:${x}%;top:${y}%" onclick="region=region==='${r}'?null:'${r}';home();document.getElementById('listsec').scrollIntoView({behavior:'smooth'})">${r}<small>${cnt[r]||0}名</small></button>`).join('')}</div>

function filt(){const q=$('#q').value.replace(/\s/g,'');document.querySelectorAll('#list .mem').forEach(e=>{e.style.display=e.dataset.n.replace(/\s/g,'').includes(q)?'':'none'})}

function rankPage(){nav('#/rank');const [lab,fn]=RK[rankKey];const arr=[...DATA].sort((a,b)=>fn(b)-fn(a));const mx=Math.max(...arr.map(fn));const mn=arr.reduce((a,d)=>a+fn(d),0)/arr.length;const rk=arr.map((d,i)=>1+arr.findIndex(x=>f(fn(x))===f(fn(d))));

  <div class="chips">${Object.entries(RK).map(([k,v])=>`<a class="chip ${k===rankKey?'on':''}" href="#/rank" onclick="rankKey='${k}';rankPage();return false">${v[0]}</a>`).join('')}</div>

function radar(d){const cx=170,cy=150,R=100,n=AX.length;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/2,cy+Math.sin(a)*R*v/2]};
  const ring=v=>AX.map((_,i)=>pt(i,v).join(',')).join(' ');
  const poly=AX.map(([,k],i)=>pt(i,ratio(d,k)).join(',')).join(' ');
  return `<svg class="radar" viewBox="-50 0 440 300" role="img" aria-label="5つの軸のレーダーチャート。外側の線は平均の2倍、点線は全員平均">
   <polygon points="${ring(2)}" fill="none" stroke="#a8dcb8" stroke-width="1.2"/><polygon points="${ring(1)}" fill="#fff" fill-opacity=".6" stroke="#5a8a72" stroke-width="1.2" stroke-dasharray="4 3"/>
   ${AX.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,2)[0]}" y2="${pt(i,2)[1]}" stroke="#a8dcb8" stroke-width="1"/>`).join('')}
   <polygon points="${poly}" fill="#1f9d57" fill-opacity=".28" stroke="#1f9d57" stroke-width="2.2" stroke-linejoin="round"/>
   ${AX.map(([l,k],i)=>{const p=pt(i,ratio(d,k));const q=pt(i,2.55);const anchor=q[0]<cx-8?'end':q[0]>cx+8?'start':'middle';
     return `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#1f9d57"/><text x="${q[0]}" y="${q[1]-2}" text-anchor="${anchor}" font-size="11" font-weight="700">${l}</text><text x="${q[0]}" y="${q[1]+12}" text-anchor="${anchor}" font-size="11" fill="#14693a" style="fill:#14693a">${f(ratio(d,k),2)}</text>`}).join('')}
   <text x="${cx+4}" y="${cy-R/2-3}" font-size="9" style="fill:#5a8a72">平均</text></svg>`}
function bar(v,top,m){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/top*100))}%"></i><u style="left:${Math.min(100,m/top*100)}%"></u></div>`}
function metric(l,v){const c=Math.min(2,v||0);return `<div class="m"><span>${l}</span><div class="bar"><i style="width:${c/2*100}%"></i><u style="left:50%"></u></div><b>${(v||0)>2?'2.0':f(c)}</b></div>`}
function when(s){const m=/^R(\d\d)(\d\d)(\d\d)/.exec(s||'');return m?`令和${+m[1]}年${+m[2]}月${+m[3]}日の会議`:s}
function quotes(d,kind){const q=l=>d.s.ev[l].filter(x=>x.k===kind);const one=(x,t,c)=>`<blockquote>${esc(x.t)}<cite><span class="tag ${c}">${t}</span><span>${when(x.s)}</span></cite></blockquote>`;
  const c=q('C'),v=q('V');return `<h3 style="margin-top:4px">判断のもとになった再質問(例)</h3>`+c.slice(0,2).map(x=>one(x,'具体性あり','ok')).join('')+v.slice(0,1).map(x=>one(x,'具体性なし','ai')).join('')}

function summaryCard(d){const c=SC[d.id],V=VT[d.id];const L=[];

function methodPage(){nav('#/about');$('#main').innerHTML=`<div><a class="chip" href="#/about">← 出典・見方</a></div>
<section class="sec"><h2>採点方法の説明</h2><div class="card"><p style="margin:0">通信簿の点数は、会議録に残る発言から機械的に数えた「量」と、AIが読み取った「質」の合計です。質は一つの視点にすぎず、絶対的な評価ではありません。</p></div></section>
<section class="sec"><h2>この通信簿の見方</h2><div class="card"><p style="margin:0 0 8px">前任期(2022年9月〜2026年9月)の議員19人を、同じ材料・同じ物差しで測ります。</p>
<div class="prow"><span class="t"><b>全員に同じ基準を当てます。</b> 材料は会議録だけです。人柄や政治的な立場、賛否の中身は点数に入れません。</span></div>
<div class="prow"><span class="t"><b>量は機械が数えます。</b> 発言の文字数、登壇の回数、役職を、会議録から数えた事実です。</span></div>
<div class="prow"><span class="t"><b>質はAIが読みます。</b> 一つの視点でAIが読んで推定した結果で、<b>絶対的な評価ではありません。</b> 判断の根拠となった発言は、議員ページで原文のまま見られます。</span></div>
<div class="prow"><span class="t"><b>量と質は別に扱います。</b> 質の点には、発言が多いことによる加点を入れません。</span></div>
<div class="prow"><span class="t"><b>言い回しの差は、原稿や文章の設計の差です。</b> 発言の長さや口調ではなく、構成・言葉選び・具体性の違いから生じます。会議録からは、原稿を読んだかどうかは分かりません。</span></div>
<div class="prow"><span class="t"><b>根拠がない判断はしません。</b> 読み取れなければ「確認できず」とし、点を付けて埋めることはしません。</span></div></div></section>
<section class="sec"><h2>総合点の構成</h2><div class="card"><p style="margin:0 0 8px">総合点は次の6つの合計です。点数は別々に出し、内訳を見られるようにします。</p>
<div class="numw"><table class="numt tl"><tr><th>指標</th><th>種別</th><th>何を見るか</th><th>点の付き方</th></tr><tr><td>公約マッチ</td><td>AI判定</td><td>選挙公報の公約に沿った質問をしたか</td><td>公約の範囲ごとの重みで加点、確認できなければ弱く減点</td></tr><tr><td>登壇</td><td>数える</td><td>一般質問・代表質問の登壇回数</td><td>期あたり平均回数×0.2(上限0.8)</td></tr><tr><td>委員会(量)</td><td>数える</td><td>委員としての発言文字数</td><td>委員会の種類ごとの平均との比を、そのまま点数に反映(上限なし)</td></tr><tr><td>役職加算</td><td>数える</td><td>議長・副議長・委員長・副委員長を務めた</td><td>議長0.2、副議長0.1、委員長0.1、副委員長0.08</td></tr><tr><td>一般質問の質</td><td>AI判定</td><td>質問の中身(4観点)</td><td>0.2×(4観点の倍率の合計)</td></tr><tr><td>委員会の質</td><td>AI判定</td><td>委員会での質疑の中身(3観点)</td><td>0.1×(根拠+比較+0.5×掘り下げ)</td></tr></table></div></div></section>
<section class="sec"><h2>量の指標と公約マッチの基準</h2><div class="card">
<p style="margin:0 0 8px"><b>登壇。</b> 一般質問と代表質問の登壇を数え、議会の期(9月〜翌年9月)ごとの平均回数をとります。議長・副議長を務めた期は除きます。一般質問の時間制限は全員同じのため、発言の長さは比べません。</p>
<p style="margin:0 0 8px"><b>委員会(量)。</b> 委員として出席した会議ごとの発言文字数を数え、委員会の種類ごとの平均で割って比べます。具体的な手順は次のとおりです。委員長・副委員長を務めた会議は、委員の平均から除きます。質疑の回数や提案の数は量に入れず、文字数だけを見ます。</p>
<div class="eqn" style="margin:0 0 8px">① 議員ごと・期ごと・委員会の種類ごとに、委員として出席した会議の「1会議あたり発言文字数」を出します。<br>② それを、その委員会の種類の全員平均(1会議あたり)で割ります。1.0が平均です。<br>③ 期の中で、出席回数の重みをつけて種類を平均し、期の指数にします。<br>④ 発言のない期を除いて、期の指数を平均します。これが議員の指数で、そのまま点数に加えます(上限なし)。</div>
<p style="margin:0 0 8px"><b>役職加算。</b> 役職を務めたことによる加点です。発言を減らす立場を担った分を、別枠で補うものです。</p>
<p style="margin:0 0 8px"><b>公約マッチ。</b> 2022年の選挙公報の公約を、一般質問の発言と突き合わせます。</p>
<div class="prow"><span class="t">公約は範囲で分けます。狭い(具体的)は重み1.0、中くらいは0.6、広い(理念)は0.3です。</span></div>
<div class="prow"><span class="t">満点に必要な直接の質問回数は、狭い1回、中2回、広3回です。超えると、1回ごとに0.1を加え、上限は0.5です。</span></div>
<div class="prow"><span class="t">公約の周辺に触れただけの場合は0.3です。一般質問で確認できない場合は「確認できず」と表示し、減点は0.2と弱めにします。</span></div>
<div class="prow"><span class="t">合計は公約の数の平方根で補正し、公約の多さで有利不利が出ないようにします。</span></div>
<div class="prow"><span class="t">手法やスローガンの公約は、参考値と明示します。</span></div>
<div class="prow"><span class="t">委員会で公約に沿って話した分は、このマッチには入れません。委員会の発言は、量と質の指標で見ます。</span></div>
<div class="prow"><span class="t">選挙公報の公約には、全員同じ形式で具体的な中身がほぼありません。この点は全員同じ条件です。</span></div></div></section>
<section class="sec"><h2>質の指標と掘り下げの判定基準</h2><div class="card"><p style="margin:0 0 8px">質は、発言の<b>中身が具体的か</b>で見ます。長さ・丁寧さ・口調は関係しません。</p>
<div class="numw"><table class="numt tl"><tr><th>観点</th><th>どう判定するか</th><th>使う指標</th></tr><tr><td>掘り下げ</td><td>答弁を受けて、中身に踏み込んだ再質問か(下の基準)</td><td>一般質問・委員会</td></tr><tr><td>根拠</td><td>数字や資料を示して質問しているか</td><td>一般質問・委員会</td></tr><tr><td>提案</td><td>質問に具体的な提案を含んでいるか</td><td>一般質問</td></tr><tr><td>比較・事例</td><td>他の自治体や過去との比較、具体事例を挙げているか</td><td>一般質問・委員会</td></tr></table></div>
<h3 style="margin:14px 0 6px">掘り下げ(再質問)の判定</h3><p style="margin:0 0 8px">答弁の後の再質問1回ごとに、発言を読んで次のどれかを付けます。回数ではなく、内容で判定します。</p>
<div class="numw"><table class="numt tl"><tr><th>判定</th><th>基準</th><th>重み</th></tr><tr><td>具体的な深化</td><td>答弁の中身に踏み込み、数字・固有名詞・事例・答弁への反論や論点の指摘・原因や仕組みの指摘のいずれかを含む</td><td>1.0</td></tr><tr><td>具体性のない深化・確認</td><td>追及はしているが「考え方は」「いつか」「何が難しいのか」のように中身が漠然。または確認だけの質問</td><td>0.25</td></tr><tr><td>反復</td><td>すでに言ったことを同じ形で繰り返している</td><td>0</td></tr><tr><td>提案・要望型</td><td>再質問の形でも、中心が提案・要望・お願い</td><td>対象外</td></tr><tr><td>対象外</td><td>意見表明・お礼・討論のみ、または新しい項目の最初の質問</td><td>対象外</td></tr></table></div>
<p style="margin:10px 0 0">具体性のない再質問をゼロにしない理由は、再質問をしたこと自体は追及の姿勢だからです。ただし、中身がある再質問とは区別し、重みを4分の1にしています。迷ったときは「具体性なし」に寄せます。</p></div></section>
<section class="sec"><h2>共通ルール</h2><div class="card">
<div class="prow"><span class="t"><b>倍率で比べます。</b> 質の各観点は、19人全員の平均を「1.0」とした倍率で表します。平均なら1.0、平均の半分なら0.5です。</span></div>
<div class="prow"><span class="t"><b>倍率の上限は2.0です。</b> 特定の観点だけが突出して総合点を左右しないようにしています。言い回しの好みで差が開きすぎることも防ぎます。</span></div>
<div class="prow"><span class="t"><b>件数が少ないときは平均に寄せます。</b> 判定できた件数が少ない議員の倍率は、偏りやすいため件数に応じて1.0に近づけます。掘り下げは、一般質問で、10件未満なら件数÷10、委員会で、30件未満なら件数÷30の割合です。根拠・比較は、50ブロック未満の議員に同様の補正をかけます。</span></div>
<div class="prow"><span class="t"><b>委員会の掘り下げは抽出で判定します。</b> 委員会の再質問は6,194件あるため、無作為に約15%を抽出し、各議員最低20件を確保しています(986件)。抽出による誤差があり、件数の少ない議員ほど大きくなります。一般質問の再質問525件は全件を判定しています。</span></div>
<div class="prow"><span class="t"><b>発言の読み取りは、AIが1件ずつ読んで行います。</b> 文字の一致や語句の数え上げだけでは、深化と反復を分けられなかったためです。迷ったときは、点数が低いほうに寄せます。</span></div></div></section>
<section class="sec"><h2>限界と注意</h2><div class="card">
<div class="prow"><span class="t">点数は、19人の相対比較です。点が低いことは、議員としての価値が低いことを意味しません。</span></div>
<div class="prow"><span class="t">会議録に残らない活動(市民相談、視察、会派内の調整、質問を作る前の調査)は評価できません。</span></div>
<div class="prow"><span class="t">解釈は重みのつけ方で変わります。重みは公開しているので、上の表と照らして確かめられます。</span></div>
<div class="prow"><span class="t">前任期の委員会記録には、2022年10月〜2023年2月の空白があります。該当期間の委員会の発言は、量と質のどちらにも入りません。</span></div>
<div class="prow"><span class="t">発言の判定に誤りがあれば、議員ページの根拠の原文を見て、ご指摘ください。誤りが確認できた判定は直して、この説明の更新日とともに記録します。</span></div></div></section>`}
function easyBox(d,conv){return `<details class="d chatfold"><summary><span class="nm">会話でさらっと読む</span><span class="v">やさしい版</span><span class="sub">質問と答えを、話し言葉に直してまとめました。AIが作ったもので、言い回しは原文と違います。</span></summary><div class="chat" style="padding:0 14px 14px">${conv.map(m=>m.w==='議員'?`<div class="msg g"><span class="who">${esc(d.name)}議員</span><div class="bub">${esc(m.t)}</div></div>`:`<div class="msg c"><span class="who">${esc(m.r||'市')}</span><div class="bub">${esc(m.t)}</div></div>`).join('')}</div></details>`}
function qaSec(d){const L=QA[d.id];if(!L)return soon('一般質問の要約','質問ごとに、議員の問いと市の答えを、分かりやすい言葉で要約して並べます。原文は折りたたんで見られます。');
  return `<section class="sec"><h2>一般質問の要約<small><span class="tag ai">AI要約</span> ${L.length}回</small></h2>${L.map(b=>`<details class="d"><summary><span class="nm">${b.date.replace(/^(\d+)-(\d+)-(\d+)$/,'$1年$2月$3日')}</span><span class="v">${b.topics.length}項目</span><span class="sub">${b.topics.slice(0,3).map(t=>esc(t.t)).join(' / ')}${b.topics.length>3?' ほか':''}</span></summary><div class="dbody">${b.topics.map((t,i)=>`<div><h3>${esc(t.t)}</h3><p style="margin:6px 0 0"><b>議員:</b> ${esc(t.a)}</p>${t.r?`<p style="margin:4px 0 0"><b>市:</b> ${esc(t.r)}</p>`:''}${t.q?`<blockquote style="margin-top:6px">${esc(t.q)}</blockquote>`:''}${b.easy&&b.easy[i]?easyBox(d,b.easy[i]):''}<details class="d chatfold" data-m="${d.id}" data-b="${b.blk}" data-k="${i}"><summary><span class="nm">この項目の原文を読む</span><span class="v">質問・答弁</span><span class="sub">この項目に関する質問・答弁・再質問・再答弁を、会議録から抜き出しています。</span></summary><div class="chat" style="padding:0 14px 14px"></div></details></div>`).join('')}${b.unc?`<div class="note">AIの自信がない点: ${esc(b.unc)}</div>`:''}<details class="d chatfold" data-m="${d.id}" data-b="${b.blk}"><summary><span class="nm">会議録の全文を、元の順番で読む</span><span class="v">チャット形式</span><span class="sub">議員の発言は緑、市側の答弁は黄色です。上の項目ごとの原文をすべて合わせると、この全文になります。</span></summary><div class="chat" style="padding:0 14px 14px"></div></details><div class="muted">出典: 会議録(${esc(b.blk.split('-')[0])})</div></div></details>`).join('')}<div class="note">要約はAIが作ったもので、人の確認前です。正確な言い回しは、原文の引用と会議録で確かめてください。</div></section>`}
function guidePage(){nav('#/guide');$('#main').innerHTML=`<div class="guide"><section class="sec"><h2>はじめての方へ</h2><div class="card"><p>このサイトは、高砂市議会の前任期(2022年9月〜2026年9月)の議員19人が、議会で何を話し、どう採決したかを、公開資料から整理したものです。全部を読む必要はありません。気になる議員を1人選んで、ページの先頭の「3行で」と通信簿だけ見れば十分です。</p></div></section>
  <section class="sec"><h2>1. 市議会は何をするところ?</h2><div class="card"><p>市の予算や条例(まちのルール)を、市長側の案をもとに審議して、賛成か反対かを決めます。議員は、市民の代表としてその場で質問し、採決に加わります。</p><dl class="gl"><dt>一般質問</dt><dd>議員が、市の仕事全般について市長や担当部署に質問する場です。議員ごとにテーマを選べます。「登壇」とは、この質問のために演壇に立つことです。</dd><dt>代表質問</dt><dd>会派(議員のグループ)を代表して行う質問です。</dd><dt>委員会</dt><dd>議案を分野ごとに細かく調べる小さな会議です。文教厚生・建設経済・予算決算などがあります。議員は、いずれかの委員会に所属します。</dd><dt>陳情・請願</dt><dd>市民や団体が、議会に出す要望です。議会は採択するかどうかを採決で決めます。</dd><dt>議案</dt><dd>市長が出す予算・条例などの案です。議会が可決するか否決するかを決めます。</dd></dl></div></section>
  <section class="sec"><h2>2. このサイトの点数の読み方</h2><div class="card"><p>点数は、19人の中での相対的な位置を示す目安です。「平均より高め」「平均前後」「平均より低め」の言葉を添えています。</p><p>点数の一部は、発言の回数や文字数を数えた事実です。もう一部(質問の質・公約マッチ)は、AIが発言を読んで推定したもので、人の確認前です。どちらかは、各行の印で分かります。</p><p>数が多い・少ないのは、議員の良し悪しではありません。委員会の所属や、立場によって、発言の機会は変わります。</p></div></section>
  <section class="sec"><h2>3. 見るときのコツ</h2><div class="card"><p>点数だけでなく、「一般質問の要約」で、実際に何を質問し、市がどう答えたかを読むのがおすすめです。陳情・議案の賛否は、点数に入れていません。</p><p>おかしいと思う点は、「出典・見方」の訂正依頼からお知らせください。</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn" href="#/">議員を選ぶ</a><a class="btn ghost" href="#/about">出典・見方</a></div></div></section></div>`}

document.addEventListener('toggle',e=>{const el=e.target;if(!(el.classList&&el.classList.contains('chatfold'))||!el.open)return;const box=el.querySelector('.chat');if(box.dataset.done)return;
  const b=(QA[el.dataset.m]||[]).find(x=>x.blk===el.dataset.b);if(!b||!b.chat)return;box.dataset.done='1';
  const bub=(c,txt,cont)=>c.w==='議員'?`<div class="msg g"><span class="who">${esc(c.n)}議員${cont?'(発言の続き)':''}</span><div class="bub">${esc(txt)}</div></div>`:`<div class="msg c"><span class="who">${esc(c.r)} ${esc(c.n)}${cont?'(発言の続き)':''}</span><div class="bub">${esc(txt)}</div></div>`;
  if(el.dataset.k===undefined||!b.pa){box.innerHTML=b.chat.map(c=>bub(c,c.t,0)).join('');return}
  const k=+el.dataset.k;let gi=0,h='';
  b.chat.forEach(c=>{const ps=c.t.split('\n').filter(p=>p.trim());const mine=[];let first=-1;ps.forEach((p,n)=>{if(b.pa[gi++]===k){mine.push(p.trim());if(first<0)first=n}});
    if(mine.length)h+=bub(c,mine.join('\n'),first>0)});
  box.innerHTML=h},true);
document.addEventListener('toggle',e=>{const el=e.target;if(!(el instanceof HTMLDetailsElement)||!el.open||el.querySelector(':scope > .closebtn'))return;
  const b=document.createElement('button');b.type='button';b.className='closebtn';b.textContent='▲ 閉じる';
  b.onclick=()=>{el.open=false;const r=el.getBoundingClientRect();if(r.top<0)el.scrollIntoView({block:'center'})};el.appendChild(b)},true);
const tt=document.createElement('button');tt.className='totop';tt.type='button';tt.setAttribute('aria-label','ページの先頭へ');tt.textContent='↑';tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.body.appendChild(tt);
window.addEventListener('scroll',()=>tt.classList.toggle('on',window.scrollY>400),{passive:true});
const bb=document.createElement('button');bb.className='backbtn';bb.type='button';bb.setAttribute('aria-label','前のページに戻る');bb.textContent='←';document.body.appendChild(bb);
const hstack=[location.hash||'#/'];
function syncBack(){const h=location.hash||'#/';bb.classList.toggle('on',h!=='#/')}
bb.onclick=()=>{if(hstack.length>1)location.hash=hstack[hstack.length-2];else location.hash='#/'};
window.addEventListener('hashchange',()=>{const h=location.hash||'#/';if(hstack.length>1&&hstack[hstack.length-2]===h)hstack.pop();else if(hstack[hstack.length-1]!==h)hstack.push(h);route();syncBack()});route();syncBack();

if('serviceWorker' in navigator&&window.isSecureContext){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}
</script>
